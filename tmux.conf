# Remap C-b to C-a
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Mouse support
set -g mouse on

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi-style copy mode
setw -g mode-keys vi
set -g escape-time 10

#Clipboard / copy-paste
set-option -g set-clipboard on
set -g allow-passthrough on
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

#start tmux copy mode selection when dragging
bind-key -T root MouseDrag1Pane copy-mode -M
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Colors
set-option -g default-terminal "tmux-256color"

# Layout
bind-key Enter next-layout

# Splits
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# Pane movement
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send-X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

#set -g status-style fg=color0,bg=themegreen
